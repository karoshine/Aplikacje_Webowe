<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ćwiczenie 2</title>
    <style>
      tr,
      td {
        border: 1px solid black;
        background-color: rgb(118, 94, 250);
        text-align: center;
      }
      table {
        border: 1px solid black;
        border-collapse: collapse;
      }
      th {
        border: 1px solid black;
        background-color: rgb(164, 72, 197);
      }
    </style>
  </head>
  <body>
    <table style="border-collapse: collapse">
      <tr>
        <th>Nr</th>
        <th style="width: 300px">Nazwa produktu</th>
        <th style="width: 150px">Cena produktu</th>
        <th>Liczba sztuk</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Tiara przydziału</td>
        <td>300000 sztuk złota</td>
        <td>1</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Nimbus 2000</td>
        <td>2000 sztuk złota</td>
        <td>37</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Eliksir Felix Felicis</td>
        <td>987654321 sztuk złota</td>
        <td>19</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Zmieniacz czasu</td>
        <td>5982 sztuk złota</td>
        <td>43</td>
      </tr>
      <tr>
        <td>5</td>
        <td>Przypominajka</td>
        <td>420 sztuk złota</td>
        <td>782</td>
      </tr>
    </table>
  </body>
</html>
